<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Female Space | Sign Up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="signup-page">

    <div class="signup-card">

        <div class="signup-logo">
            <span>FEMALE</span>
            <small>SPACE</small>
        </div>

        <h1>Create Your Account</h1>

        <p class="signup-subtitle">
            Join Female Space and discover products made for you
        </p>

        <form id="signupForm">

            <div class="form-row">

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input
                        type="text"
                        id="firstName"
                        placeholder="First name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input
                        type="text"
                        id="lastName"
                        placeholder="Last name"
                        required
                    >
                </div>

            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="01XXXXXXXXX"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="form-row">

                <div class="form-group">

                    <label for="governorate">
                        Governorate
                    </label>

                    <select id="governorate" required>

                        <option value="">
                            Select Governorate
                        </option>

                        <option value="Cairo">
                            Cairo
                        </option>

                        <option value="Giza">
                            Giza
                        </option>

                        <option value="Alexandria">
                            Alexandria
                        </option>

                        <option value="Qalyubia">
                            Qalyubia
                        </option>

                        <option value="Dakahlia">
                            Dakahlia
                        </option>

                        <option value="Gharbia">
                            Gharbia
                        </option>

                        <option value="Sharqia">
                            Sharqia
                        </option>

                        <option value="Monufia">
                            Monufia
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Your city"
                        required
                    >

                </div>

            </div>

            <div class="form-group">

                <label for="area">
                    Area
                </label>

                <input
                    type="text"
                    id="area"
                    placeholder="Your area"
                    required
                >

            </div>

            <div class="form-group">

                <label for="address">
                    Full Address
                </label>

                <input
                    type="text"
                    id="address"
                    placeholder="Street, building, apartment"
                    required
                >

            </div>

            <button
                type="submit"
                class="signup-btn"
            >
                Create Account
            </button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="index.html">
                Enter Female Space
            </a>
        </p>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
