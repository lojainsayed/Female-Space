<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        Female Space | Sign Up
    </title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
</head>

<body>
    <div class="signup-page">
        <div class="signup-card">
            <div class="signup-logo">
    <img src="logo_web.png" alt="Female SPACE Logo">
</div>
            <h1>
                Create Your Account
            </h1>
            <p class="signup-subtitle">
                Join Female Space and discover products made for you
            </p>
            <form id="signupForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">
                            First Name
                        </label>
                        <input id="firstName" placeholder="First name" required="" type="text" />
                    </div>
                    <div class="form-group">
                        <label for="lastName">
                            Last Name
                        </label>
                        <input id="lastName" placeholder="Last name" required="" type="text" />
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">
                        Email
                    </label>
                    <input id="email" placeholder="example@email.com" required="" type="email" />
                </div>
                <div class="form-group">
                    <label for="phone">
                        Phone Number
                    </label>
                    <input id="phone" placeholder="01XXXXXXXXX" required="" type="tel" />
                </div>
                <div class="form-group">
                    <label for="password">
                        Password
                    </label>
                    <input id="password" placeholder="Create a password" required="" type="password" />
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="governorate">
                            Governorate
                        </label>
                        <select id="governorate" required="">
                            <option value="">
                                Select Governorate
                            </option>
                            <option value="Cairo">
                                Cairo
                            </option>
                            <option value="Giza">
                                Giza
                            </option>
                            <option value="Alexandria">
                                Alexandria
                            </option>
                            <option value="Qalyubia">
                                Qalyubia
                            </option>
                            <option value="Dakahlia">
                                Dakahlia
                            </option>
                            <option value="Gharbia">
                                Gharbia
                            </option>
                            <option value="Sharqia">
                                Sharqia
                            </option>
                            <option value="Monufia">
                                Monufia
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="city">
                            City
                        </label>
                        <input id="city" placeholder="Your city" required="" type="text" />
                    </div>
                </div>
                <div class="form-group">
                    <label for="area">
                        Area
                    </label>
                    <input id="area" placeholder="Your area" required="" type="text" />
                </div>
                <div class="form-group">
                    <label for="address">
                        Full Address
                    </label>
                    <input id="address" placeholder="Street, building, apartment" required="" type="text" />
                </div>
                <button class="signup-btn" type="submit">
                    Create Account
                </button>
            </form>
            <p class="login-text">
                Already have an account?
                <a href="index.html">
                    Enter Female Space
                </a>
            </p>
        </div>
    </div>
    <script src="js/script.js">
    </script>
</body>

</html>
